services:
  go-note:
    container_name: go-note
    build:
      context: .
      dockerfile: Dockerfile.http
    # 不暴露端口到宿主机，只通过网关访问（网络隔离）
    environment:
      - APP_ENV=development
      - SERVER_PORT=8080
      - ID_GENERATOR_ADDR=id-generator:50059
      - DATABASE_DRIVER=postgres
      - DATABASE_SOURCE=postgres://luckys:123456@global-postgres:5432/go_note?sslmode=disable
      - DATABASE_AUTO_MIGRATE=true
      - REDIS_ADDR=global-redis:6379
      - REDIS_PASSWORD=123456
      - USER_PLATFORM_ADDR=user-grpc:9091
      - OTEL_JAEGER_ENDPOINT=global-jaeger:4318
      - OTEL_SERVICE_NAME=go-note-http
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - go-net
    restart: unless-stopped

  go-note-grpc:
    container_name: go-note-grpc
    build:
      context: .
      dockerfile: Dockerfile.grpc
    # 不暴露端口到宿主机，只通过内网访问
    environment:
      - APP_ENV=development
      - GRPC_SERVER_PORT=9093
      - ID_GENERATOR_ADDR=id-generator:50059
      - DATABASE_DRIVER=postgres
      - DATABASE_SOURCE=postgres://luckys:123456@global-postgres:5432/go_note?sslmode=disable
      - DATABASE_AUTO_MIGRATE=false
      - REDIS_ADDR=global-redis:6379
      - REDIS_PASSWORD=123456
      - USER_PLATFORM_ADDR=user-grpc:9091
      - OTEL_JAEGER_ENDPOINT=global-jaeger:4318
      - OTEL_SERVICE_NAME=go-note-grpc
      - METRICS_PORT=9094
    networks:
      - go-net
    restart: unless-stopped

networks:
  go-net:
    name: go-net
    external: true
